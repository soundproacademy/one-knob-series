name: Republish release

# One-off: re-creates an existing release under the GitHub Actions bot, so the
# release page no longer names a personal account as its author. Same tag,
# title, notes and files. Removed again right after it has run.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to re-publish
        required: true

permissions:
  contents: write

jobs:
  republish:
    runs-on: ubuntu-latest
    steps:
      - name: Re-create the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          gh release view "$TAG" -R "$REPO" --json name,body,isPrerelease > meta.json
          gh release download "$TAG" -R "$REPO" -D assets || true
          title=$(jq -r '.name' meta.json)
          jq -r '.body // ""' meta.json > notes.md
          extra=()
          if [ "$(jq -r '.isPrerelease' meta.json)" = "true" ]; then extra+=(--prerelease); fi
          shopt -s nullglob
          files=(assets/*)
          # Deleting the release keeps the tag; the new one reuses it.
          gh release delete "$TAG" -R "$REPO" --yes
          gh release create "$TAG" -R "$REPO" --verify-tag --title "$title" --notes-file notes.md "${extra[@]}" "${files[@]}"
          gh release view "$TAG" -R "$REPO" --json author,assets --jq '"author=\(.author.login) assets=\(.assets|length)"'
